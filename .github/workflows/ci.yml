name: CareerConnect CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Build, Lint & Test Suite
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        env:
          GLIBC_TUNABLES: glibc.pthread.rseq=1
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 15s

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci || npm install

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci || npm install

      - name: Lint Frontend
        run: |
          cd client
          npm run lint

      - name: Build Frontend (Production Vite Build)
        run: |
          cd client
          npm run build
        env:
          VITE_API_URL: http://localhost:5000/api

      - name: Run Backend Isolated Integration Tests
        run: |
          cd server
          npm test
        env:
          PORT: 5055
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/careerconnect_test_db
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/careerconnect_test_db
          JWT_SECRET: ci-test-only-disposable-jwt-secret-minimum-32-chars-2026
          JWT_EXPIRE: 7d

      - name: Validate Docker Compose Configuration
        env:
          JWT_SECRET: ci-only-validation-secret-do-not-use-in-production-2026
        run: |
          docker compose config --quiet
