services:
  # Backend Web Service (Node.js / Express / Socket.IO)
  - type: web
    name: careerconnect-backend
    env: node
    region: oregon
    plan: starter
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: uploads-data
      mountPath: /app/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
        # Enter your MongoDB Atlas URI: mongodb+srv://<user>:<password>@cluster0.mongodb.net/careerconnect_db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: CLIENT_URL
        sync: false
        # Enter your frontend Vercel or Render URL: https://careerconnect.vercel.app
      - key: UPLOAD_PATH
        value: uploads
      - key: MAX_FILE_SIZE
        value: 5242880

  # Frontend Static Site (React 19 / Vite / Tailwind CSS)
  - type: web
    name: careerconnect-frontend
    env: static
    region: oregon
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: VITE_API_URL
        sync: false
        # Points to the deployed backend: https://careerconnect-backend.onrender.com/api

